name: Issue 17 Harness HITL Repro

on:
  push:
    branches: [issue-17-harness-hitl-repro]
    paths:
      - "experiments/03-agentcore-harness-approval/repro_hitl.py"
      - ".github/workflows/issue-17-harness-hitl.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  HARNESS_ARN: arn:aws:bedrock-agentcore:ap-southeast-1:063884340510:harness/lab1hitlsonnet-YL0sfGtxVb

jobs:
  hitl-repro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install current AWS SDK
        run: python -m pip install --upgrade boto3 botocore

      - name: Configure temporary OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::063884340510:role/github-actions-lab1-harness-hitl
          aws-region: ${{ env.AWS_REGION }}

      - name: Run pause reject approve reproduction
        run: python experiments/03-agentcore-harness-approval/repro_hitl.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-17-hitl-result
          path: hitl-result.json
          if-no-files-found: warn
