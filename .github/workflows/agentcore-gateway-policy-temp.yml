name: Temporary AgentCore Gateway Policy test

on:
  push:
    branches: [issue-15-agentcore-gateway-policy]
    paths:
      - "experiments/02-agentcore-gateway-policy/**"
      - ".github/workflows/agentcore-gateway-policy-temp.yml"

permissions:
  contents: read
  id-token: write

jobs:
  call:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Derive temporary caller role
        id: caller
        shell: bash
        run: |
          set -euo pipefail
          BASE_ROLE='${{ vars.AWS_OIDC_ROLE_ARN }}'
          ACCOUNT_ID="$(printf '%s' "$BASE_ROLE" | cut -d: -f5)"
          test -n "$ACCOUNT_ID"
          ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/github-actions-lab1-agent-gateway-policy"
          echo "::add-mask::${ACCOUNT_ID}"
          echo "::add-mask::${ROLE_ARN}"
          echo "role_arn=${ROLE_ARN}" >> "$GITHUB_OUTPUT"

      - name: Configure branch-scoped AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ steps.caller.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Install AWS SDK
        run: python -m pip install --quiet 'boto3>=1.40'

      - name: Discover experiment Gateway
        id: gateway
        shell: bash
        run: |
          set -euo pipefail
          URL="$(python - <<'PY'
          import boto3
          client = boto3.client('bedrock-agentcore-control')
          items = client.list_gateways().get('items', [])
          matches = [item for item in items if item.get('name') == 'lab1policygateway']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one lab1policygateway, got {len(matches)}')
          gateway = client.get_gateway(gatewayIdentifier=matches[0]['gatewayId'])
          print(gateway['gatewayUrl'])
          PY
          )"
          echo "gateway_url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Run controlled MCP tool call
        shell: bash
        run: |
          set -euo pipefail
          MODE="$(tr -d '\r\n' < experiments/02-agentcore-gateway-policy/.expected-mode)"
          REQUEST_ID="${MODE}-issue15"
          python experiments/02-agentcore-gateway-policy/invoke_gateway.py \
            --gateway-url '${{ steps.gateway.outputs.gateway_url }}' \
            --tool-name 'LabStatusTarget___read_lab_status' \
            --request-id "$REQUEST_ID" \
            --region "$AWS_REGION" \
            --expect "$MODE"
