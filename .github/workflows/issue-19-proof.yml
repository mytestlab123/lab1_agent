name: Issue 19 Integrated Governance Proof

on:
  push:
    branches: [issue-19-integrated-governance]
    paths:
      - "experiments/04-agentcore-integrated-governance/case.txt"
      - ".github/workflows/issue-19-proof.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  HARNESS_ARN: arn:aws:bedrock-agentcore:ap-southeast-1:063884340510:harness/lab1i19approval-SCVWRsgmwW
  GATEWAY_URL: https://lab1i19gateway-f266mmewq2.gateway.bedrock-agentcore.ap-southeast-1.amazonaws.com/mcp
  TOOL_NAME: lab1i19target___get_status

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install current AWS SDK
        run: python -m pip install --upgrade boto3 botocore

      - name: Configure temporary branch OIDC role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::063884340510:role/github-actions-lab1-i19
          aws-region: ${{ env.AWS_REGION }}

      - name: Select test case
        run: |
          CASE="$(tr -d '\r\n' < experiments/04-agentcore-integrated-governance/case.txt)"
          echo "CASE=$CASE" >> "$GITHUB_ENV"
          echo "Running $CASE"

      - name: Prove typed Harness approval lifecycle
        run: python experiments/03-agentcore-harness-approval/repro_hitl.py

      - name: Validate selected human decision
        run: |
          if [ "$CASE" = "REJECT" ]; then
            jq -e '.reject.passed == true and .reject.paused_on_real_approval_tool == true' hitl-result.json
          else
            jq -e '.approve.passed == true and .approve.paused_on_real_approval_tool == true' hitl-result.json
          fi

      - name: Invoke Gateway for approved Policy DENY case
        if: env.CASE == 'APPROVE_DENY'
        run: |
          python experiments/02-agentcore-gateway-policy/invoke_gateway.py \
            --gateway-url "$GATEWAY_URL" \
            --tool-name "$TOOL_NAME" \
            --request-id issue19-policy-deny \
            --region "$AWS_REGION" \
            --expect deny

      - name: Invoke Gateway for approved Policy ALLOW case
        if: env.CASE == 'APPROVE_ALLOW'
        run: |
          python experiments/02-agentcore-gateway-policy/invoke_gateway.py \
            --gateway-url "$GATEWAY_URL" \
            --tool-name "$TOOL_NAME" \
            --request-id issue19-policy-allow \
            --region "$AWS_REGION" \
            --expect allow

      - name: Show selected orchestration path
        run: |
          if [ "$CASE" = "REJECT" ]; then
            echo 'Human REJECT: Gateway was not called.'
          else
            echo "Human APPROVE: Gateway path executed for $CASE."
          fi
