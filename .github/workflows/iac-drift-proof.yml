name: IaC OIDC drift proof

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/iac-drift-proof.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lab1-agent-iac
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  AWS_ROLE_ARN: arn:aws:iam::063884340510:role/github-actions-lab1-agent-iac
  TF_STATE_BUCKET: lab1-agent-tfstate-20260912-7c4f2a
  TF_STATE_KEY: lab1-agent/issue-5/terraform.tfstate
  TF_PARAMETER_NAME: /lab1-agent/oidc-drift-proof
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show non-secret OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          token=$(printf '%s' "$response" | jq -r '.value')
          TOKEN="$token" python3 - <<'PY'
          import base64, json, os
          token = os.environ["TOKEN"]
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload.encode()))
          print(f"OIDC aud={claims.get('aud')}")
          print(f"OIDC sub={claims.get('sub')}")
          print(f"OIDC repository={claims.get('repository')}")
          print(f"OIDC ref={claims.get('ref')}")
          PY

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity --query Arn --output text >/dev/null

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform format
        run: terraform -chdir=infra fmt -check

      - name: Terraform init
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Terraform plan
        run: |
          terraform -chdir=infra plan -input=false -out=tfplan \
            -var="aws_region=${AWS_REGION}" \
            -var="parameter_name=${TF_PARAMETER_NAME}"

      - name: Terraform apply
        run: terraform -chdir=infra apply -input=false -auto-approve tfplan
