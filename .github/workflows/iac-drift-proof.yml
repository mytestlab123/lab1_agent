name: IaC OIDC drift proof

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/iac-drift-proof.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lab1-agent-iac
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: lab1-agent/issue-5/terraform.tfstate
  TF_PARAMETER_NAME: ${{ vars.TF_PARAMETER_NAME }}
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository variables
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_ARN TF_STATE_BUCKET TF_PARAMETER_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "Required repository variable is missing for ${name}" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity --query Arn --output text >/dev/null

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform format
        run: terraform -chdir=infra fmt -check

      - name: Terraform init
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Terraform plan
        run: |
          terraform -chdir=infra plan -input=false -out=tfplan \
            -var="aws_region=${AWS_REGION}" \
            -var="parameter_name=${TF_PARAMETER_NAME}"

      - name: Terraform apply
        run: terraform -chdir=infra apply -input=false -auto-approve tfplan
