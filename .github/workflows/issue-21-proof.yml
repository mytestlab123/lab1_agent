name: Issue 21 Identity Proof

on:
  push:
    branches: [issue-21-identity-aware-policy]
    paths:
      - ".github/workflows/issue-21-proof.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  GATEWAY_URL: https://lab1i19gateway-f266mmewq2.gateway.bedrock-agentcore.ap-southeast-1.amazonaws.com/mcp

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configure caller A
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::063884340510:role/github-actions-lab1-i21-allow
          aws-region: ${{ env.AWS_REGION }}
      - name: Prove identity
        run: aws sts get-caller-identity
      - name: Search current Gateway tools
        shell: bash
        run: |
          curl --silent --show-error --fail-with-body \
            --aws-sigv4 "aws:amz:${AWS_REGION}:bedrock-agentcore" \
            --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
            -H "x-amz-security-token: ${AWS_SESSION_TOKEN}" \
            -H "Accept: application/json, text/event-stream" \
            -H "Content-Type: application/json" \
            -H "MCP-Protocol-Version: 2025-03-26" \
            --data '{"jsonrpc":"2.0","id":"issue21-search","method":"tools/call","params":{"name":"x_amz_bedrock_agentcore_search","arguments":{"query":"read-only status provider get_status"}}}' \
            "$GATEWAY_URL"
