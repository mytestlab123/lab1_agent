name: Issue 21 Identity Proof

on:
  push:
    branches: [issue-21-identity-aware-policy]
    paths:
      - ".github/workflows/issue-21-proof.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  GATEWAY_URL: https://lab1i19gateway-f266mmewq2.gateway.bedrock-agentcore.ap-southeast-1.amazonaws.com/mcp
  TOOL_NAME: lab1i19target___get_status

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install AWS SDK
        run: python -m pip install --upgrade boto3 botocore
      - name: Configure caller A
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::063884340510:role/github-actions-lab1-i21-allow
          aws-region: ${{ env.AWS_REGION }}
      - name: Prove identity
        run: aws sts get-caller-identity
      - name: Invoke retained Gateway
        run: |
          python experiments/02-agentcore-gateway-policy/invoke_gateway.py \
            --gateway-url "$GATEWAY_URL" \
            --tool-name "$TOOL_NAME" \
            --request-id issue21-caller-a \
            --region "$AWS_REGION" \
            --expect allow
