name: Temporary AgentCore package upload

on:
  push:
    branches: [issue-13-agentcore-runtime]
    paths:
      - "experiments/01-agentcore-runtime/**"
      - ".github/workflows/agentcore-package-temp.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Unit tests
        run: python -m unittest discover -s experiments/01-agentcore-runtime/tests -v

      - name: Build standard ZIP
        run: |
          mkdir -p .build/agentcore-runtime
          cd experiments/01-agentcore-runtime/app
          zip -X -9 "$GITHUB_WORKSPACE/.build/agentcore-runtime/deployment_package.zip" main.py
          unzip -t "$GITHUB_WORKSPACE/.build/agentcore-runtime/deployment_package.zip"

      - name: Configure temporary branch-scoped AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::063884340510:role/github-actions-lab1-agent-agentcore-package
          aws-region: ap-southeast-1
          mask-aws-account-id: true

      - name: Upload exact experiment artifact
        run: |
          aws s3 cp .build/agentcore-runtime/deployment_package.zip \
            s3://lab1-agent-agentcore-d68ea7509e/runtime/deployment_package.zip \
            --only-show-errors
